# Temporary pre-merge reproducibility gate for research PRs #22–#24.
# This workflow intentionally tests named unmerged research branches against their
# checked-in frozen fixtures, without moving their contents into main.
# Update/remove the matrix when research branches are merged or renamed.
name: Validate independent research branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-branch-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reproduction:
    name: ${{ matrix.lane }} / offline source and exhibit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: R1
            ref: research/r1-productivity-compensation
          - lane: R2
            ref: research/r2-household-viability
          - lane: R3
            ref: research/r3-distribution-evidence
    steps:
      - name: Checkout corresponding research PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Record exact evidence commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
      - name: Execute committed offline validators
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.lane }}" in
            R1)
              python3 research/R1/scripts/r1_analysis.py --offline --out /tmp/gd-r1-offline
              python3 -m unittest discover -s research/R1/scripts -p 'test_*.py' -v
              ;;
            R2)
              python3 research/R2/reproduce.py --check
              python3 -m unittest discover -s research/R2 -p 'test_*.py' -v
              ;;
            R3)
              python3 research/R3/reproduce.py validate
              ;;
            *)
              echo "Unsupported research lane" >&2
              exit 2
              ;;
          esac
      - name: State evidence limitations
        run: |
          echo "These tests cover deterministic offline code and committed fixtures only."
          echo "They do not download full historic source data, replicate survey microdata,"
          echo "validate source licensing, identify causal effects, or pass research gate #11."
